name: Build Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: apk
            runner: ubuntu-latest

          - target: aab
            runner: ubuntu-latest

          - target: ipa
            runner: macos-latest

          - target: ios-simulator
            runner: macos-latest

          - target: linux
            runner: ubuntu-latest

          - target: macos
            runner: macos-latest

          - target: web
            runner: ubuntu-latest

          - target: windows
            runner: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Create sample Flet app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sample/src
          cat > sample/pyproject.toml <<'EOF'
          [project]
          name = "flet-build-action-smoke-test"
          version = "0.1.0"
          requires-python = ">=3.10"
          dependencies = ["flet"]

          [tool.flet]
          org = "dev.flet"
          product = "Smoke Test"
          company = "Flet"

          [tool.flet.app]
          path = "src"
          EOF
          cat > sample/src/main.py <<'EOF'
          import flet as ft


          def main(page: ft.Page):
              page.add(ft.Text("Flet build action smoke test"))


          ft.run(main)
          EOF

      - name: Build app
        id: build
        uses: ./
        with:
          target: ${{ matrix.target }}
          working-directory: sample
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-number: ${{ github.run_number }}

      - name: Verify action outputs
        shell: bash
        env:
          OUTPUT_PATH: ${{ steps.build.outputs.output-path }}
          ARCHIVE_PATH: ${{ steps.build.outputs.archive-path }}
        run: |
          set -euo pipefail
          test -d "$OUTPUT_PATH"
          test -f "$ARCHIVE_PATH"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
          overwrite: false
