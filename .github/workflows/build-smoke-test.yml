name: Build Smoke Test

on:
  push:
    branches: ['test/ubuntu-26.04']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: apk
            runner: ubuntu-26.04

          - target: aab
            runner: ubuntu-26.04

          - target: linux
            runner: ubuntu-26.04

          - target: web
            runner: ubuntu-26.04

          # 24.04 controls
          - target: apk
            runner: ubuntu-24.04

          - target: linux
            runner: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Create sample Flet app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sample/src
          cat > sample/pyproject.toml <<'EOF'
          [project]
          name = "flet-build-action-smoke-test"
          version = "0.1.0"
          requires-python = ">=3.10"
          dependencies = ["flet"]

          [tool.flet]
          org = "dev.flet"
          product = "Smoke Test"
          company = "Flet"

          [tool.flet.app]
          path = "src"

          # flet 1.0.3 workaround for flet-dev/flet#6919 (fixed in 1.0.4)
          [tool.flet.flutter.pubspec.dependency_overrides]
          jni = "^1.1.0"
          EOF
          cat > sample/src/main.py <<'EOF'
          import flet as ft


          def main(page: ft.Page):
              page.add(ft.Text("Flet build action smoke test"))


          ft.run(main)
          EOF

      - name: Runner diagnostics
        shell: bash
        run: |
          set +e
          grep -E '^(VERSION|VERSION_CODENAME)=' /etc/os-release
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion JAVA_HOME=$JAVA_HOME"
          findmnt -no FSTYPE,SIZE,OPTIONS /tmp

      - name: Build app
        id: build
        uses: ./
        with:
          target: ${{ matrix.target }}
          working-directory: sample
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-number: ${{ github.run_number }}

      - name: Verify action outputs
        shell: bash
        env:
          OUTPUT_PATH: ${{ steps.build.outputs.output-path }}
          ARCHIVE_PATH: ${{ steps.build.outputs.archive-path }}
        run: |
          set -euo pipefail
          test -d "$OUTPUT_PATH"
          test -f "$ARCHIVE_PATH"
