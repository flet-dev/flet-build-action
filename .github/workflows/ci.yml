name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test action helper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Run tests
        run: uv run pytest

      - name: Check formatting
        run: uv run ruff format --check scripts tests

      - name: Run lint
        run: uv run ruff check scripts tests

      - name: Parse workflow YAML
        run: >-
          uv run python -c
          'import yaml; [yaml.safe_load(open(path, encoding="utf-8")) for path in
          ("action.yml", ".github/workflows/ci.yml", ".github/workflows/build-smoke-test.yml")]'
